name: Validate

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
  schedule:
    # Catches breakage from new Home Assistant releases.
    - cron: "0 6 * * 1"

jobs:
  test:
    name: Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install homeassistant pytest pytest-asyncio ruff \
                      bleak-retry-connector aiousbwatcher habluetooth \
                      bluetooth-adapters bluetooth-auto-recovery \
                      bluetooth-data-tools dbus-fast pyserial

      - name: Lint
        run: ruff check custom_components/ tests/ --select E,F,W,I,UP,B,SIM --line-length 100

      - name: Test
        run: python -m pytest tests/ -q

  hassfest:
    name: Hassfest
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: home-assistant/actions/hassfest@master

  hacs:
    name: HACS
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: hacs/action@main
        with:
          category: integration
          # `brands` requires an entry in home-assistant/brands, which only
          # gates listing in the HACS default store. This is a custom
          # repository, so the check does not apply - installing works
          # without it, at the cost of a generic icon in the UI.
          ignore: brands
